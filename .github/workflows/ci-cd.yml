
name: Plantify CI-CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t sehrishjabeen/plantify:v1.0 .

      # Step 3: Test Docker image
      - name: Test Docker Image
        run: |
          docker image inspect sehrishjabeen/plantify:v1.0

      # Step 4: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 5: Push image to Docker Hub
      - name: Push Docker Image
        run: |
          docker push sehrishjabeen/plantify:v1.0
          docker tag sehrishjabeen/plantify:v1.0 sehrishjabeen/plantify:latest
          docker push sehrishjabeen/plantify:latest

      # Step 6: Deploy to AWS EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull sehrishjabeen/plantify:latest
            docker stop plantify-container || true
            docker rm plantify-container || true
            docker run -d \
              --name plantify-container \
              --restart unless-stopped \
              -p 80:8081 \
              sehrishjabeen/plantify:latest
            docker ps
