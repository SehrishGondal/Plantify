
name: Plantify CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-test-push:
    name: Build, Test and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t plantify:latest .

      - name: Test Docker Container
        run: |
          docker run -d -p 8080:80 --name plantify-test plantify:latest
          for i in {1..10}; do
            if curl -fsS http://localhost:8080/; then
              echo "Plantify container test successful"
              exit 0
            fi
            sleep 3
          done
          docker logs plantify-test
          exit 1

      - name: Login to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          docker tag plantify:latest ${{ secrets.DOCKERHUB_USERNAME }}/plantify:latest
          docker tag plantify:latest ${{ secrets.DOCKERHUB_USERNAME }}/plantify:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/plantify:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/plantify:${{ github.sha }}

      - name: Cleanup Test Container
        if: always()
        run: docker rm -f plantify-test || true
